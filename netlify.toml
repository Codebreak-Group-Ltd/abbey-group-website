[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Security headers (SEO audit, 29 Aug 2026). HSTS already comes from Netlify's
# own default; everything else was missing entirely.
#
# CSP keeps 'unsafe-inline' on script-src and style-src rather than nonces:
# this is a static build (no per-request server to mint a nonce), and the site
# already ships several legitimate inline <script> tags (BaseLayout's Consent
# Mode default, the hero motion/scroll-reveal scripts, CookieConsent's own
# script) and inline `style={...}` attributes throughout the component set.
# Rewriting all of that to hashed/external scripts is real future work, not a
# launch blocker — what this DOES lock down today is arbitrary remote script
# injection (script-src has an explicit host allowlist, no wildcard), framing
# (frame-ancestors 'none' — nothing on the site is ever framed), and the
# base/object/form-action vectors, which cost nothing to close now.
#
# Hosts allowlisted below are every external endpoint the site actually
# loads/posts to today (`src/lib/tracking.ts`, `EnquiryForm.astro`,
# `consent-registry.ts`): GA4, Meta Pixel, and Codebreak's own campaign
# tracking/AI-qualification and GoHighLevel webhooks. None of these fire
# before consent (build standard §6/§7) — this header only controls what the
# BROWSER is allowed to load, not when.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = '''
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://ai.codebreak.co.uk;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https://www.facebook.com;
      font-src 'self';
      connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://www.facebook.com https://services.leadconnectorhq.com https://ai.codebreak.co.uk https://app.usecortana.ai;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self' https://services.leadconnectorhq.com https://ai.codebreak.co.uk https://app.usecortana.ai;
      object-src 'none';
    '''

# Directory-style URLs (trailing slash canon, see astro.config.mjs and
# _Specs/05 ASTRO BUILD STANDARD.md §1). Astro's own build already emits
# `/page/index.html`, which Netlify serves at `/page/` by default — this file
# exists so the build command and Node version are explicit and versioned,
# not left to Netlify's autodetection.

# /lp/homecare-boiler-draw/ retired 25 Aug 2026 (Josh): superseded by
# /lp/win-a-new-boiler/, the prize-led page paired with Variant A's fuller
# body. Its source page was deleted, so this redirect is load-bearing, not
# a belt-and-braces extra — without it the URL 404s. `force = true` so it
# still applies even if a stale build ever leaves a file at that path.
[[redirects]]
  from = "/lp/homecare-boiler-draw/"
  to = "/lp/win-a-new-boiler/"
  status = 301
  force = true

# /prize-draw-terms/ retired 25 Aug 2026 (Josh): superseded by the full
# numbered-clause version at /lp/boiler-draw-terms/. Never had ad spend or
# indexing behind it, but the redirect costs nothing and closes off a URL
# that briefly existed.
[[redirects]]
  from = "/prize-draw-terms/"
  to = "/lp/boiler-draw-terms/"
  status = 301
  force = true

# --- Legacy domain consolidation (abbeygas.com, abbeyhomecare.co.uk) -------
# Abbey Group is consolidating abbeygas.com and abbeyhomecare.co.uk into this
# site under abbeygroup.uk (CLAUDE.md, build brief). URL inventory taken from
# each live site's nav/sitemap on 28 Aug 2026 — see LAUNCH.md for the source
# crawl. These rules are domain-qualified so they only fire once each domain
# is added to this Netlify site (Domain management > Domain aliases) and its
# DNS is pointed here — that DNS access is still outstanding, tracked in
# `_Specs/01 OUTSTANDING FROM CLIENT.md` §B3. Until DNS is switched, these
# rules are inert (Netlify never sees traffic for a domain it isn't serving).
# Once live, each old domain should also go through Google Search Console's
# Change of Address tool — this only handles the HTTP-level 301s.

[[redirects]]
  from = "https://abbeygas.com/about-us/"
  to = "https://abbeygroup.uk/about/"
  status = 301
  force = true

